name: Publish to VS Code Marketplace and Open VSX

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.json (${PKG_VERSION})"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build extension
        run: yarn package

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version --out extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish -p "$VSCE_TOKEN" --packagePath extension.vsix
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish extension.vsix -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
