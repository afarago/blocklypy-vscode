name: Build

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Tag, branch, or commit SHA to build (defaults to triggering ref)"
        required: false
        type: string
  push:
    branches:
      - master
      - "feature/**"
      - "feat/**"
    tags:
      - "build-test-*"
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  native-prebuild-matrix:
    name: Native Prebuild Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run native prebuild resolver tests
        run: npx jest src/utils/prebuild-resolver.test.ts --runInBand --config jest.config.js

  vscode-integration-tests:
    name: VS Code Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run VS Code extension tests
        run: xvfb-run -a yarn test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: npx jest --runInBand --config jest.config.js

      - name: Lint
        run: yarn lint

      - name: Build extension
        run: yarn package

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Get VSIX filename
        id: vsix
        run: echo "file=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.file }}
          path: ${{ steps.vsix.outputs.file }}
          retention-days: 14
